<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMG - Map Home</title>
    <!-- 引入圖示庫 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/home.css">
</head>

<body>

    <main class="app-container">
        <!-- 頂部標題欄 -->
        <header class="home-header">
            <div class="logo">OMG</div>
            <div class="user-status"><i class="fa-solid fa-bell"></i></div>
        </header>

        <!-- 地圖區域 -->
        <div class="map-container" id="mapContainer">
            <!-- 地圖背景圖片 -->
            <div class="map-bg"></div>

            <!-- 局部遮罩層 (僅限地圖範圍) -->
            <div class="fab-overlay" id="fabOverlay"></div>

            <!-- 標記點將由 JS 動態產生於此 -->
            <div class="post-modal" id="postModal">
                <div class="polaroid-card">
                    <button class="close-modal" id="closeModal">&times;</button>
                    <div class="polaroid-image">
                        <!-- 預留圖片空間 -->
                        <img src="assets/cat.jpg" id="modalImage" alt="Post Image">
                    </div>
                    <div class="polaroid-content">
                        <p id="modalText">這裡的貓不理人，給負評</p>
                        <div class="polaroid-actions">
                            <button class="action-item" id="likeBtn">
                                <i class="fa-regular fa-heart"></i>
                                <span class="count">0</span>
                            </button>
                            <button class="action-item" id="saveBtn">
                                <i class="fa-regular fa-bookmark"></i>
                                <span class="count">0</span>
                            </button>
                        </div>
                        <span class="post-date">2023.10.27</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部功能鍵組 -->
        <div class="fab-wrapper" id="fabWrapper">
            <!-- 子按鈕 1: Profile -->
            <a href="profile.html" class="fab-child">
                <i class="fa-solid fa-user"></i>
            </a>
            <!-- 子按鈕 2: Upload -->
            <a href="upload.html" class="fab-child">
                <i class="fa-solid fa-camera"></i>
            </a>
            <!-- 子按鈕 3: Pet -->
            <a href="pet.html" class="fab-child">
                <i class="fa-solid fa-paw"></i>
            </a>

            <!-- 主功能按鈕 -->
            <button class="fab-main" id="fabToggle">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>
    </main>

    <script>
        const fabWrapper = document.getElementById('fabWrapper');
        const fabToggle = document.getElementById('fabToggle');
        const fabOverlay = document.getElementById('fabOverlay');
        const mapContainer = document.getElementById('mapContainer');
        const postModal = document.getElementById('postModal');
        const closeModal = document.getElementById('closeModal');

        // --- 1. 底部選單與遮罩邏輯 ---
        fabToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            const isActive = fabWrapper.classList.toggle('active');
            if (isActive) {
                fabOverlay.classList.add('active');
            } else {
                fabOverlay.classList.remove('active');
            }
        });

        // 點擊遮罩區域自動縮回 FAB 選單
        fabOverlay.addEventListener('click', () => {
            fabWrapper.classList.remove('active');
            fabOverlay.classList.remove('active');
        });

        // --- 2. 彈窗關閉邏輯 (移到外部，只需執行一次) ---
        closeModal.addEventListener('click', (e) => {
            e.stopPropagation(); // 防止觸發到下方的地圖點擊
            postModal.classList.remove('show');
        });

        postModal.addEventListener('click', (e) => {
            // 點擊深色背景處才關閉
            if (e.target === postModal) {
                postModal.classList.remove('show');
            }
        });

        // --- 3. 模擬資料庫資料 (未來你可以從後台獲取這串 JSON) ---
const postsData = [
    {
        id: 1,
        img: 'assets/cat.jpg',
        text: '他不答應跟我交換身體，差評',
        date: '2023.10.27',
        likes: 5,
        saves: 2,
        isLiked: false,
        isSaved: false
    },
    {
        id: 2,
        img: 'assets/map.jpg', // 這裡換成你其他的圖片路徑
        text: '是誰在這裡迷路了?是我',
        date: '2023.10.28',
        likes: 12,
        saves: 8,
        isLiked: false,
        isSaved: false
    },
    {
        id: 3,
        img: 'assets/eat.jpg',
        text: '沒有鳳梨，一點都不道地',
        date: '2023.10.29',
        likes: 20,
        saves: 1,
        isLiked: false,
        isSaved: false
    },
    // 你可以根據 markerCount 增加更多資料...
];

let currentPostIndex = null; // 用來記錄當前彈窗顯示的是哪一則貼文

// --- 4. 產生標記與資料綁定 ---
const markerCount = postsData.length; // 根據資料數量產生標記

for (let i = 0; i < markerCount; i++) {
    const marker = document.createElement('div');
    marker.className = 'map-marker';

    const randomX = Math.floor(Math.random() * 80) + 10;
    const randomY = Math.floor(Math.random() * 70) + 15;
    marker.style.left = `${randomX}%`;
    marker.style.top = `${randomY}%`;

    // 點擊標記
    marker.addEventListener('click', function (e) {
        e.stopPropagation();
        
        // 1. 放大效果
        document.querySelectorAll('.map-marker').forEach(m => m.classList.remove('enlarge'));
        this.classList.add('enlarge');

        // 2. 更新彈窗內容
        updateModal(i);

        // 3. 顯示彈窗
        postModal.classList.add('show');
    });

    mapContainer.appendChild(marker);
}

// 函式：根據索引值更新彈窗內容
function updateModal(index) {
    currentPostIndex = index;
    const data = postsData[index];

    // 填入圖片、文字、日期
    document.getElementById('modalImage').src = data.img;
    document.getElementById('modalText').innerText = data.text;
    document.querySelector('.post-date').innerText = data.date;

    // 填入愛心與收藏數字
    const likeCountSpan = likeBtn.querySelector('.count');
    const saveCountSpan = saveBtn.querySelector('.count');
    likeCountSpan.innerText = data.likes;
    saveCountSpan.innerText = data.saves;

    // 恢復按鈕狀態 (如果之前點過，要顯示實心)
    if (data.isLiked) {
        likeBtn.classList.add('like-active', 'active');
        likeBtn.querySelector('i').classList.replace('fa-regular', 'fa-solid');
    } else {
        likeBtn.classList.remove('like-active', 'active');
        likeBtn.querySelector('i').classList.replace('fa-solid', 'fa-regular');
    }

    if (data.isSaved) {
        saveBtn.classList.add('save-active', 'active');
        saveBtn.querySelector('i').classList.replace('fa-regular', 'fa-solid');
    } else {
        saveBtn.classList.remove('save-active', 'active');
        saveBtn.querySelector('i').classList.replace('fa-solid', 'fa-regular');
    }
}

// --- 5. 獨立的愛心與收藏邏輯 (會修改 postsData) ---
likeBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (currentPostIndex === null) return;
    
    const data = postsData[currentPostIndex];
    data.isLiked = !data.isLiked; // 切換狀態
    data.likes += data.isLiked ? 1 : -1; // 增減數字
    
    updateModal(currentPostIndex); // 重新刷新介面顯示
});

saveBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (currentPostIndex === null) return;

    const data = postsData[currentPostIndex];
    data.isSaved = !data.isSaved;
    data.saves += data.isSaved ? 1 : -1;
    
    updateModal(currentPostIndex);
});

        // 點擊地圖空白處重置標記點大小
        document.addEventListener('click', (e) => {
            if (!e.target.classList.contains('map-marker')) {
                document.querySelectorAll('.map-marker').forEach(m => m.classList.remove('enlarge'));
            }
        });


    </script>
</body>

</html>
