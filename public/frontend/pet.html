<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>我的寵物</title>
  <link rel="stylesheet" href="css/pet.css" />
</head>
<body>

  <div class="phoneShell">

    <!-- Background -->
    <div class="sceneBg">
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
      <div class="bubble"></div>
    </div>
    <div class="sceneFloor"></div>
    <div class="sceneRug"></div>

    <!-- Top Bar：返回 ＋ 寵物名字 -->
    <header class="topBar">
      <button class="btnBack" aria-label="返回" onclick="window.location.href='home.html'">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <div class="petNameWrapper">
        <span class="petName">泡泡 🐾</span>
      </div>
      <div style="width:36px; flex-shrink:0;"></div>
    </header>

    <!-- Stats：右上角（寶石 / 經驗值 / 飢餓度） -->
    <aside class="statsCluster">

      <!-- 寶石 + 經驗值 -->
      <div style="display:flex; align-items:center; gap:6px;">
        <div class="gemRow">
          <span class="gemIcon">💎</span>
          <span class="gemValue" id="gemValue">1000</span>
        </div>
        <div class="statCard">
          <div class="statLabel"><span>⭐</span> 經驗值</div>
          <div class="barTrack">
            <div class="barFill barFillExp" id="barExp" style="width:0%"></div>
          </div>
          <div class="statNum" id="expText">0 / 100</div>
        </div>
      </div>

      <!-- 飢餓度 -->
      <div class="statCard">
        <div class="statLabel"><span>🍖</span> 飢餓度</div>
        <div class="barTrack">
          <div class="barFill barFillHunger" id="barHunger" style="width:0%"></div>
        </div>
        <div class="statNum" id="hungerText">0 / 100</div>
      </div>

    </aside>

    <!-- 寵物角色（中央） -->
    <!-- 寵物角色（中央） -->
<div class="petWrapper" id="petWrapper" onclick="petTap()">
  <div id="petAccessory"></div>
  <span class="heartPop" id="heartPop">💕</span>
  <div class="petSpeech" id="petSpeech"></div>

  <!-- 分層圖片：deco → face → body（由下往上疊） -->
  <div class="petLayerWrap">
    <img class="petLayer" id="layerBody" src="" alt="body" />
    <img class="petLayer" id="layerFace" src="" alt="face" />
    <img class="petLayer petLayerDeco" id="layerDeco" src="" alt="deco" />
  </div>
</div>

    <!-- Bottom Action Bar -->
    <nav class="actionBar">
      <div class="actionBtn" onclick="openWardrobe()">
        <div class="actionCircle actionCircleWardrobe">
          <span class="actionEmoji">👗</span>
        </div>
        <span class="actionLabel">飾品</span>
      </div>
      <div class="actionBtn" onclick="openFood()">
        <div class="actionCircle actionCircleFood">
          <span class="actionEmoji">🍱</span>
        </div>
        <span class="actionLabel">食物</span>
      </div>
    </nav>

    <!-- ══ 食物收納箱 Modal ══ -->
    <div class="modalOverlay" id="foodModal">
      <div class="modalBox">
        <div class="modalHeader">
          <span class="modalTitle">🍱 食物櫃</span>
          <button class="modalClose" onclick="closeModal('foodModal')" aria-label="關閉">✕</button>
        </div>
        <div class="modalGrid">
          <div class="itemCard" onclick="feedPet('比目魚')">
            <span class="itemEmoji">🐟</span>
            <span class="itemBadge">4</span>
            <span class="itemName">比目魚</span>
            <span class="itemCost">−20💎</span>
          </div>
          <div class="itemCard" onclick="feedPet('鮭魚')">
            <span class="itemEmoji">🐠</span>
            <span class="itemBadge">3</span>
            <span class="itemName">鮭魚</span>
            <span class="itemCost">−25💎</span>
          </div>
          <div class="itemCard" onclick="feedPet('貓貓鹽')">
            <span class="itemEmoji">🧂</span>
            <span class="itemBadge">4</span>
            <span class="itemName">貓貓鹽</span>
            <span class="itemCost">−10💎</span>
          </div>
          <div class="itemCard" onclick="feedPet('檸檬果')">
            <span class="itemEmoji">🍋</span>
            <span class="itemBadge">3</span>
            <span class="itemName">檸檬果</span>
            <span class="itemCost">−15💎</span>
          </div>
          <div class="itemCard itemLow" onclick="feedPet('滋味肉')">
            <span class="itemEmoji">🥩</span>
            <span class="itemBadge badgeLow">1/4</span>
            <span class="itemName">滋味肉</span>
            <span class="itemCost itemCostLow">−40💎</span>
          </div>
          <div class="itemCard itemLow" onclick="feedPet('超雞棒')">
            <span class="itemEmoji">🍗</span>
            <span class="itemBadge badgeLow">1/4</span>
            <span class="itemName">超雞棒</span>
            <span class="itemCost itemCostLow">−35💎</span>
          </div>
          <div class="itemCard itemLow" onclick="feedPet('爆爆蝦')">
            <span class="itemEmoji">🍤</span>
            <span class="itemBadge badgeLow">1/4</span>
            <span class="itemName">爆爆蝦</span>
            <span class="itemCost itemCostLow">−45💎</span>
          </div>
          <div class="itemCard itemLow" onclick="feedPet('蘋果')">
            <span class="itemEmoji">🍏</span>
            <span class="itemBadge badgeLow">1/4</span>
            <span class="itemName">蘋果</span>
            <span class="itemCost itemCostLow">−12💎</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ══ 飾品衣櫃 Modal ══ -->
    <div class="modalOverlay" id="wardrobeModal">
  <div class="modalBox">
    <div class="modalHeader">
      <span class="modalTitle">👗 飾品衣櫃</span>
      <button class="modalClose" onclick="closeModal('wardrobeModal')" aria-label="關閉">✕</button>
    </div>

    <!-- Tabs -->
    <div class="modalTabs">
      <button class="modalTab tabActive" onclick="switchWardrobeTab('body', this)">🐾 身體</button>
      <button class="modalTab" onclick="switchWardrobeTab('face', this)">😺 臉型</button>
      <button class="modalTab" onclick="switchWardrobeTab('deco', this)">✨ 配件</button>
    </div>

    <!-- Body Panel -->
    <div class="wardrobePanel panelActive" id="wardrobePanel-body">
      <div class="itemCard" onclick="useWardrobeItem(this, 'body', 'body_0')">
        <div class="itemPetThumb">
          <img src="assets/pet/body_0.png" alt="">
        </div>
        <span class="itemBadge">✓</span>
        <span class="itemName">預設</span>
      </div>
      <div class="itemCard" onclick="useWardrobeItem(this, 'body', 'body_1')">
        <div class="itemPetThumb">
          <img src="assets/pet/body_1.png" alt="">
        </div>
        <span class="itemBadge">1</span>
        <span class="itemName">柚子</span>
      </div>
      <div class="itemCard" onclick="useWardrobeItem(this, 'body', 'body_2')">
        <div class="itemPetThumb">
          <img src="assets/pet/body_2.png" alt="">
        </div>
        <span class="itemBadge">1</span>
        <span class="itemName">蛋黃酥</span>
      </div>
    </div>

    <!-- Face Panel -->
    <div class="wardrobePanel" id="wardrobePanel-face">
      <div class="itemCard" onclick="useWardrobeItem(this, 'face', 'face_0')">
        <div class="itemPetThumb">
          <img src="assets/pet/face_0.png" alt="">
        </div>
        <span class="itemBadge">✓</span>
        <span class="itemName">笑臉</span>
      </div>
      <div class="itemCard" onclick="useWardrobeItem(this, 'face', 'face_1')">
        <div class="itemPetThumb">
          <img src="assets/pet/face_1.png" alt="">
        </div>
        <span class="itemBadge">1</span>
        <span class="itemName">無奈</span>
      </div>
    </div>

    <!-- Deco Panel -->
    <div class="wardrobePanel" id="wardrobePanel-deco">
      <!-- 無配件選項 -->
      <div class="itemCard" onclick="useWardrobeItem(this, 'deco', '')">
        <span class="itemEmoji">✕</span>
        <span class="itemName">無</span>
      </div>
      <div class="itemCard" onclick="useWardrobeItem(this, 'deco', 'deco_0')">
        <div class="itemPetThumb">
          <img src="assets/pet/deco_0.png" alt="">
        </div>
        <span class="itemBadge">1</span>
        <span class="itemName">驚嘆號</span>
      </div>
      <div class="itemCard" onclick="useWardrobeItem(this, 'deco', 'deco_1')">
        <div class="itemPetThumb">
          <img src="assets/pet/deco_1.png" alt="">
        </div>
        <span class="itemBadge">1</span>
        <span class="itemName">生氣</span>
      </div>
      <div class="itemCard" onclick="useWardrobeItem(this, 'deco', 'deco_2')">
        <div class="itemPetThumb">
          <img src="assets/pet/deco_2.png" alt="">
        </div>
        <span class="itemBadge">2</span>
        <span class="itemName">葉子</span>
      </div>
    </div>

  </div>
</div>

  </div><!-- /.phoneShell -->

  <script src="js/pet.js"></script>

</body>
</html>
