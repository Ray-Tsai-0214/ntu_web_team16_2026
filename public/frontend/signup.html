<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMG — Sign up</title>
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <main class="app-container">

    <header class="auth-header">
      <div class="auth-logo" id="logoEmoji">🦄</div>
      <h1 class="auth-title">Join OMG</h1>
      <p class="auth-subtitle">Share the weird side of campus</p>
    </header>

    <section class="auth-card">
      <h2>Create account</h2>

      <div class="auth-error" id="errorBox"></div>

      <form id="signupForm" novalidate>
        <div class="field">
          <label class="field-label" for="username">Username</label>
          <input
            class="field-input"
            type="text"
            id="username"
            name="username"
            placeholder="penguin_lover"
            autocomplete="username"
            required
            minlength="3"
            maxlength="20"
            pattern="[a-zA-Z0-9_]+"
          >
          <div class="field-hint">3–20 characters · letters, numbers, underscore</div>
        </div>

        <div class="field">
          <label class="field-label" for="password">Password</label>
          <input
            class="field-input"
            type="password"
            id="password"
            name="password"
            placeholder="at least 6 characters"
            autocomplete="new-password"
            required
            minlength="6"
          >
        </div>

        <div class="field">
          <label class="field-label">Pick your avatar</label>
          <div class="emoji-picker" id="emojiPicker">
            <button type="button" class="emoji-option selected" data-emoji="🦄">🦄</button>
            <button type="button" class="emoji-option" data-emoji="🐧">🐧</button>
            <button type="button" class="emoji-option" data-emoji="🐱">🐱</button>
            <button type="button" class="emoji-option" data-emoji="🦊">🦊</button>
            <button type="button" class="emoji-option" data-emoji="🐼">🐼</button>
            <button type="button" class="emoji-option" data-emoji="🦦">🦦</button>
            <button type="button" class="emoji-option" data-emoji="🦉">🦉</button>
            <button type="button" class="emoji-option" data-emoji="🐸">🐸</button>
            <button type="button" class="emoji-option" data-emoji="🦕">🦕</button>
            <button type="button" class="emoji-option" data-emoji="🐙">🐙</button>
            <button type="button" class="emoji-option" data-emoji="🦝">🦝</button>
            <button type="button" class="emoji-option" data-emoji="👻">👻</button>
          </div>
        </div>

        <button type="submit" class="auth-submit" id="submitBtn">
          <span id="submitText">Sign up</span>
        </button>
      </form>

      <p class="auth-switch">
        Already a member?<a href="login.html">Log in</a>
      </p>
    </section>

  </main>

  <script src="js/api.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
