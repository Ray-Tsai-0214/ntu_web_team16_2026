<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OMG - User Profile</title>
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <main class="app-container">
    
    <header class="profile-header">
      <div class="header-top">
        <a href="home.html" class="back-btn" aria-label="Go back">
          <i class="fa-solid fa-chevron-left"></i>
        </a>
        <button id="logoutBtn" class="logout-btn" aria-label="Log out">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
      <div class="header-main">
        <div class="pet-avatar-container">
          <div class="pet-avatar">🐧</div>
        </div>
        <div class="user-info">
          <h1 class="username">Username</h1>
          <p class="user-id">ID: OMG-9527</p>
          <span class="level-badge"><i class="fa-solid fa-star"></i> Lv.1</span>
        </div>
      </div>
    </header>

    <section class="stats-row">
      <div class="stat-item">
        <span class="stat-value">0</span>
        <span class="stat-label">Points</span>
      </div>
      <div class="stat-item">
        <span class="stat-value">0</span>
        <span class="stat-label">Posts</span>
      </div>
      <div class="stat-item">
        <span class="stat-value">0</span>
        <span class="stat-label">Reactions</span>
      </div>
    </section>

    <div class="tab-container">
      <button class="tab-btn active">My Posts</button>
      <button class="tab-btn">Saved</button>
    </div>

    <section class="post-feed">
      <!-- Empty for fast rendering -->
      <div class="empty-feed">
        <p>You haven't posted anything yet.</p>
        <p style="font-size: 0.85rem; margin-top: 8px; opacity: 0.7;">
          Tap the + button on the map to share something weird.
        </p>
      </div>
    </section>

  </main>

  <script src="js/api.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
