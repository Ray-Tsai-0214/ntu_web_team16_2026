<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMG - Mapbox Home</title>

    <!-- Mapbox GL JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.20.0/mapbox-gl.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/home.css">
</head>

<body>

    <main class="app-container">
        <!-- 頂部標題欄 -->
        <header class="home-header">
            <div class="logo">OMG</div>
            <span class="header-weather" id="headerWeather">⏳</span>
            <button class="user-status" id="userStatus" type="button" aria-label="Account">
              <i class="fa-solid fa-user"></i>
            </button>
        </header>

        <!-- 地圖區域：裡面只放地圖 -->
        <div class="map-container">
            <div id="map" style="width: 100%; height: 100%;"></div>
        </div>



        <!-- 修正點 1：將遮罩與彈窗移到地圖外面，避免事件被地圖攔截 -->
        <div class="fab-overlay" id="fabOverlay"></div>

        <div class="post-modal" id="postModal">
            <div class="polaroid-card">
                <button class="close-modal" id="closeModal" type="button">&times;</button>
                <div class="polaroid-image">
                    <img src="" id="modalImage" alt="Post Image">
                </div>
                <div class="polaroid-content">
                    <p id="modalText"></p>
                    <div class="polaroid-actions">
                        <button class="action-item" id="likeBtn" type="button">
                            <i class="fa-regular fa-heart"></i>
                            <span class="count">0</span>
                        </button>
                        <button class="action-item" id="saveBtn" type="button">
                            <i class="fa-regular fa-bookmark"></i>
                            <span class="count">0</span>
                        </button>
                    </div>
                    <span class="post-date"></span>
                </div>
            </div>
        </div>
        <!-- 全螢幕貼文詳情層 -->
        <div class="full-view-overlay" id="fullView">
            <div class="full-view-header">
                <button id="closeFullView"><i class="fa-solid fa-chevron-down"></i></button>
                <span class="header-title">貼文詳情</span>
            </div>

            <div class="full-view-scroll-area">
                <div class="full-content-card">
                    <div class="full-image-wrapper">
                        <img src="" id="fullViewImage">
                    </div>

                    <!-- <div class="reaction-stats-bar" id="reactionStats"></div> -->

                    <div class="full-text-content">
                        <p id="fullViewText"></p>

                        <!-- 【新增位置】保留愛心與收藏按鈕 -->
                        <div class="polaroid-actions full-actions">
                            <button class="action-item" id="fullLikeBtn" type="button">
                                <i class="fa-regular fa-heart"></i>
                                <span class="count">0</span>
                            </button>
                            <button class="action-item" id="fullSaveBtn" type="button">
                                <i class="fa-regular fa-bookmark"></i>
                                <span class="count">0</span>
                            </button>
                        </div>

                        <div class="full-meta">
                            <span id="fullViewDate"></span>
                            <div class="tags-row" id="fullViewTags"></div>
                        </div>
                    </div>
                </div>

                <!-- 留言區塊 (預留介面) -->
                <div class="comment-section">
                    <h3 class="section-title">留言板</h3>
                    <div class="comment-list" id="commentList">
                        <div class="empty-comment">目前還沒有留言，快來搶頭香！</div>
                    </div>
                </div>
            </div>

            <!-- 底部輸入框 -->
            <div class="comment-bar">
                <input type="text" id="commentInput" placeholder="說點什麼好笑的...">
                <button id="sendComment"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
        <!-- 底部功能鍵組 -->
        <div class="fab-wrapper" id="fabWrapper">
            <a href="profile.html" class="fab-child"><i class="fa-solid fa-user"></i></a>
            <a href="upload.html" class="fab-child"><i class="fa-solid fa-camera"></i></a>
            <a href="pet.html" class="fab-child"><i class="fa-solid fa-paw"></i></a>
            <button class="fab-main" id="fabToggle"><i class="fa-solid fa-plus"></i></button>
        </div>
    </main>

    <!-- API 工具 + 頁面邏輯 -->
    <script src="js/api.js"></script>
    <script src="js/home.js"></script>
</body>

</html>
